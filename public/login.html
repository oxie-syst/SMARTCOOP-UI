<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SmartCoop</title>

  <link rel="stylesheet" href="css/style.css">

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>

<body class="auth-body">

  <main class="auth-wrapper">

    <section class="brand-header">

      <div class="logo-box">
        S
      </div>

      <div>
        <h1>SmartCoop</h1>
        <p>Smart Poultry Management</p>
      </div>

    </section>


    <section class="auth-card">

      <div class="card-header">

        <h2>Welcome back</h2>

        <p>
          Enter your credentials to access your account
        </p>

      </div>


      <form
        id="loginForm"
        class="form-stack">

        <div class="input-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="farmer@gmail.com"
            autocomplete="email"
            required>

        </div>


        <div class="input-group">

          <div class="label-row">

            <label for="password">
              Password
            </label>

          <a href="forgot-password.html" class="small-link">
            Forgot?
          </a>

          </div>

<div class="password-wrapper">
  <input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
  >

  <button
    type="button"
    class="password-toggle"
    id="toggleLoginPassword"
    aria-label="Show password"
    aria-pressed="false"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </button>
</div>


        <label class="check-row">

          <input
            id="remember"
            type="checkbox">

          <span>
            Remember me
          </span>

        </label>


        <button
          type="submit"
          class="primary-btn"
          id="loginBtn">

          Sign in

        </button>

      </form>


      <div class="divider">
        <span>or continue with</span>
      </div>


      <div class="social-login">

        <div
          id="g_id_onload"
          data-client_id="809976421121-0fg5n8g6jc02vgb61pr927pgbrmf8hn5.apps.googleusercontent.com"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false">
        </div>

        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="continue_with"
          data-size="large"
          data-logo_alignment="left"
          data-width="320">
        </div>

      </div>

      <div class="auth-footer">

        Don't have an account?

        <a href="signup.html">
          Sign up
        </a>

      </div>

    </section>


    <div class="auth-footer">

      <a
        href="index.html"
        class="back-home">

        ← Back to Home

      </a>

    </div>

  </main>


  <div
    id="toast"
    class="toast hidden">
  </div>


<script src="js/auth.js"></script>

</body>

</html>
