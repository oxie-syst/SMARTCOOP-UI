<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SmartCoop</title>

  <link rel="stylesheet" href="css/style.css">

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>

<body class="auth-body">

  <main class="auth-wrapper">

    <section class="brand-header">

      <div class="logo-box">
        S
      </div>

      <div>
        <h1>SmartCoop</h1>
        <p>Smart Poultry Management</p>
      </div>

    </section>


    <section class="auth-card">

      <div class="card-header">

        <h2>Welcome back</h2>

        <p>
          Enter your credentials to access your account
        </p>

      </div>


      <form
        id="loginForm"
        class="form-stack">

        <div class="input-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="farmer@smartcoop.com"
            autocomplete="email"
            required>

        </div>


        <div class="input-group">

          <div class="label-row">

            <label for="password">
              Password
            </label>

          <a href="forgot-password.html" class="small-link">
            Forgot?
          </a>

          </div>

          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

        </div>


        <label class="check-row">

          <input
            id="remember"
            type="checkbox">

          <span>
            Remember me
          </span>

        </label>


        <button
          type="submit"
          class="primary-btn"
          id="loginBtn">

          Sign in

        </button>

      </form>


      <div class="divider">
        <span>or continue with</span>
      </div>


      <div class="social-login">

        <div
          id="g_id_onload"
          data-client_id="809976421121-0fg5n8g6jc02vgb61pr927pgbrmf8hn5.apps.googleusercontent.com"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false">
        </div>

        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="continue_with"
          data-size="large"
          data-logo_alignment="left"
          data-width="320">
        </div>

      </div>

      <div class="auth-footer">

        Don't have an account?

        <a href="signup.html">
          Sign up
        </a>

      </div>

    </section>


    <div class="auth-footer">

      <a
        href="index.html"
        class="back-home">

        ← Back to Home

      </a>

    </div>

  </main>


  <div
    id="toast"
    class="toast hidden">
  </div>


  <script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function (event) {

      event.preventDefault();

      const button =
        document.getElementById("loginBtn");

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email,
            password
          })
        });

        const result = await response.json();

        console.log("LOGIN RESULT:", result);

        if (!result.success) {
          alert(
            result.message ||
            "Invalid email or password."
          );

          button.disabled = false;
          button.textContent = "Sign in";

          return;
        }

        localStorage.setItem(
          "user",
          JSON.stringify(result.user)
        );

        localStorage.setItem(
          "smartcoop_user",
          JSON.stringify(result.user)
        );

        if (result.user.onboardingCompleted) {
          window.location.href = "user.html";
        } else {
          window.location.href = "onboarding.html";
        }

      } catch (error) {
        console.error("LOGIN ERROR:", error);

        alert("Unable to connect to the server.");

        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
</script>

<script src="js/auth.js"></script>

</body>

</html>
