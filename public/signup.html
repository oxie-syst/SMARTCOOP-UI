<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup - SmartCoop</title>

  <link rel="stylesheet" href="css/style.css">

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>
</head>

<body class="auth-body">

  <main class="auth-wrapper">

    <section class="brand-header">

      <div class="logo-box">
        S
      </div>

      <div>
        <h1>SmartCoop</h1>
        <p>Smart Poultry Management</p>
      </div>

    </section>


    <section class="auth-card">

      <div class="card-header">

        <h2>Create an account</h2>

        <p>
          Start managing your poultry farm smartly
        </p>

      </div>


      <form
        id="signupForm"
        class="form-stack">


        <div
          id="signupError"
          class="error-box hidden">
        </div>


        <div class="input-group">

          <label for="name">
            Full Name
          </label>

          <input
            id="name"
            type="text"
            placeholder="Enter your full name"
            autocomplete="name"
            required>

        </div>


        <div class="input-group">

          <label for="signupEmail">
            Email
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required>

        </div>


        <div class="input-group">

          <label for="phoneNumber">
            Phone Number
          </label>

            <input
              id="phoneNumber"
              type="tel"
              placeholder="09XXXXXXXXX"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="11"
              pattern="09[0-9]{9}"
              title="Phone number must be exactly 11 digits and start with 09."
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11)"
              required>
        </div>


        <div class="input-group">

          <label for="signupPassword">
            Password
          </label>

          <div class="password-box">

          <input
            id="signupPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="new-password"
            minlength="8"
            required>

            <span
              class="toggle-icon"
              onclick="togglePassword('signupPassword', this)">

              👁

            </span>

          </div>

        </div>


        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-box">

            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm password"
              autocomplete="new-password"
              required>

            <span
              class="toggle-icon"
              onclick="togglePassword('confirmPassword', this)">

              👁

            </span>

          </div>

        </div>

        <div class="signup-terms">
          <input
            type="checkbox"
            id="agreeTerms"
            name="agreeTerms"
            required
          >

          <label for="agreeTerms">
            I agree to SmartCoop's
            <a href="terms.html" data-policy="terms">
              Terms and Conditions
            </a>
            and
            <a href="privacy.html" data-policy="privacy">
              Privacy Policy
            </a>.
          </label>
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="signupBtn">

          Create Account

        </button>

      </form>


      <div class="divider">
        <span>or continue with</span>
      </div>


      <div class="social-login">

        <div
          id="g_id_onload"
          data-client_id="809976421121-0fg5n8g6jc02vgb61pr927pgbrmf8hn5.apps.googleusercontent.com"
          data-callback="handleGoogleCredential"
          data-auto_prompt="false">
        </div>

        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="continue_with"
          data-size="large"
          data-logo_alignment="left"
          data-width="320">
        </div>

      </div>


      <div class="auth-footer">

        Already have an account?

        <a href="login.html">
          Sign in
        </a>

      </div>

    </section>


    <div class="auth-footer">

      <a
        href="index.html"
        class="back-home">

        ← Back to Home

      </a>

    </div>

  </main>


  <div
    id="toast"
    class="toast hidden">
  </div>

  <div
  id="policyModal"
  class="policy-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="policyModalTitle"
  hidden
>
  <div class="policy-modal-content">

    <div class="policy-modal-header">
      <h2 id="policyModalTitle"></h2>

      <button
        type="button"
        id="closePolicyX"
        aria-label="Close policy"
      >
        &times;
      </button>
    </div>

    <div
      id="policyModalBody"
      class="policy-modal-body"
    ></div>

    <div class="policy-modal-footer">
      <button
        type="button"
        id="closePolicyBtn"
      >
        Close
      </button>
    </div>

  </div>
</div>


  <script src="js/auth.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const modal = document.getElementById("policyModal");
  const title = document.getElementById("policyModalTitle");
  const body = document.getElementById("policyModalBody");

  let previousFocus = null;

  async function openPolicy(type) {
    const isTerms = type === "terms";
    const url = isTerms ? "terms.html" : "privacy.html";

    previousFocus = document.activeElement;

    title.textContent = isTerms
      ? "Terms and Conditions"
      : "Privacy Policy";

    body.textContent = "Loading policy...";
    modal.hidden = false;

    document.getElementById("closePolicyX").focus();

    try {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Policy not found");
      }

      const html = await response.text();
      const doc = new DOMParser().parseFromString(
        html,
        "text/html"
      );

      const content = doc.querySelector("main") || doc.body;

      // Remove executable elements from loaded content.
      content.querySelectorAll(
        "script, iframe, object, embed, form"
      ).forEach(element => element.remove());

      if (!modal.hidden) {
        body.replaceChildren(...Array.from(content.childNodes));
      }

    } catch (error) {
      body.textContent =
        "Unable to load the policy. Please try again.";
    }
  }

  function closePolicy() {
    modal.hidden = true;
    previousFocus?.focus();
  }

  document.querySelectorAll("[data-policy]").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();
      openPolicy(link.dataset.policy);
    });
  });

  document.getElementById("closePolicyX")
    .addEventListener("click", closePolicy);

  document.getElementById("closePolicyBtn")
    .addEventListener("click", closePolicy);

  modal.addEventListener("click", event => {
    if (event.target === modal) {
      closePolicy();
    }
  });

  document.addEventListener("keydown", event => {
    if (modal.hidden) return;

    if (event.key === "Escape") {
      closePolicy();
    }

    if (event.key === "Tab") {
      const focusable = Array.from(
        modal.querySelectorAll("button, a[href], [tabindex]")
      ).filter(element => element.tabIndex >= 0);

      if (!focusable.length) return;

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });
});
</script>

</body>

</html>
