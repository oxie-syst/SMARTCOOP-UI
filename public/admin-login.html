<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | SmartCoop</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-body admin-auth-body">

  <main class="auth-wrapper admin-auth-wrapper">

    <section class="brand-header">

      <div class="logo-box">
        S
      </div>

      <div>
        <h1>SmartCoop</h1>
        <p>Administration Portal</p>
      </div>

    </section>


    <section class="auth-card admin-login-card">

      <div class="admin-login-icon">
        <i data-lucide="shield-check"></i>
      </div>


      <div class="card-header">

        <span class="admin-login-label">
          ADMINISTRATOR ACCESS
        </span>

        <h2>
          Administrator Sign In
        </h2>

        <p>
          Sign in using an authorized SmartCoop
          administrator account.
        </p>

      </div>


      <form
        id="adminLoginForm"
        class="form-stack">

        <div
          id="adminLoginError"
          class="error-box hidden">
        </div>


        <div class="input-group">

          <label for="adminUsername">
            Admin Username
          </label>

          <div class="admin-input-box">

            <i data-lucide="user"></i>

            <input
              id="adminUsername"
              type="text"
              placeholder="Enter administrator username"
              autocomplete="username"
              required>

          </div>

        </div>


        <div class="input-group">

          <div class="label-row">

            <label for="adminPassword">
              Password
            </label>

          </div>


          <div class="admin-input-box">

            <i data-lucide="lock-keyhole"></i>

            <input
              id="adminPassword"
              type="password"
              placeholder="Enter administrator password"
              autocomplete="current-password"
              required>

            <button
              type="button"
              class="admin-password-toggle"
              onclick="toggleAdminPassword()">

              <i
                id="adminPasswordIcon"
                data-lucide="eye">
              </i>

            </button>

          </div>

        </div>


        <button
          type="submit"
          class="primary-btn admin-login-btn"
          id="adminLoginBtn">

          <i data-lucide="log-in"></i>

          Sign in as Administrator

        </button>

      </form>


      <div class="admin-security-note">

        <i data-lucide="shield-alert"></i>

        <div>
          <strong>
            Restricted Access
          </strong>

          <p>
            This portal is intended only for authorized
            SmartCoop administrators.
          </p>
        </div>

      </div>


      <div class="auth-footer">

        Not an administrator?

        <a href="login.html">
          Return to User Login
        </a>

      </div>

    </section>


    <div class="auth-footer">

      <a
        href="index.html"
        class="back-home">

        ← Back to Home

      </a>

    </div>

  </main>


  <script src="js/auth.js"></script>

  <script>
    function toggleAdminPassword() {
      const input =
        document.getElementById("adminPassword");

      const icon =
        document.getElementById(
          "adminPasswordIcon"
        );

      if (!input) return;

      if (input.type === "password") {
        input.type = "text";

        if (icon) {
          icon.setAttribute(
            "data-lucide",
            "eye-off"
          );
        }

      } else {
        input.type = "password";

        if (icon) {
          icon.setAttribute(
            "data-lucide",
            "eye"
          );
        }
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }


    document.addEventListener(
      "DOMContentLoaded",
      function () {
        if (window.lucide) {
          lucide.createIcons();
        }
      }
    );
  </script>

</body>
</html>
